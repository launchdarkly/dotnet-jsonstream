version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "nuget"
    directory: "/benchmark/LaunchDarkly.JsonStream.Benchmarks"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "nuget"
    directory: "/src/LaunchDarkly.JsonStream"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "nuget"
    directory: "/test/LaunchDarkly.JsonStream.Tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
